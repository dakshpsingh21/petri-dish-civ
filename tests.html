<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Petri Dish Civilization: tests</title>
  <style>
    body { background: #10141c; color: #cfd8e3; font: 14px monospace; padding: 16px; }
    .pass { color: #7fd1b9; }
    .fail { color: #ff6b6b; }
    canvas { image-rendering: pixelated; width: 400px; height: 300px; margin-top: 12px; }
  </style>
</head>
<body>
  <h2>Tests</h2>
  <ul id="results"></ul>
  <div>Noise preview (seed 12345). Should look like soft clouds, not TV static:</div>
  <canvas id="preview" width="200" height="150"></canvas>

  <!-- Zero-dependency test runner: each test is a function that throws if something is wrong. -->
  <script type="module">
    import { createRng, hashString } from './src/rng.js';
    import { noiseMap } from './src/noise.js';
    import { createSim, step } from './src/sim.js';
    import { config, WORLD_WIDTH, WORLD_HEIGHT } from './src/config.js';
    import { PASSABLE } from './src/world.js';
    import { GENE_NAMES, inheritGenes, copyCulture, neutralCulture, geneDistance } from './src/genes.js';
    import { metabolize } from './src/agent.js';
    import { createBus } from './src/events.js';

    const list = document.getElementById('results');
    function test(name, fn) {
      let ok = true, msg = '';
      try { fn(); } catch (e) { ok = false; msg = ' -> ' + e.message; }
      const li = document.createElement('li');
      li.className = ok ? 'pass' : 'fail';
      li.textContent = (ok ? 'PASS ' : 'FAIL ') + name + msg;
      list.appendChild(li);
    }
    function assert(cond, msg) { if (!cond) throw new Error(msg); }
    const sameArray = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);

    // ---------- rng.js ----------
    test('rng: same seed -> same sequence', () => {
      const a = createRng(42), b = createRng(42);
      for (let i = 0; i < 1000; i++) assert(a.next() === b.next(), 'diverged at ' + i);
    });
    test('rng: "petri" first roll is 0.932482 (value locked in S1)', () => {
      assert(createRng(hashString('petri')).next().toFixed(6) === '0.932482', 'changed!');
    });

    // ---------- noise.js ----------
    const W = 200, H = 150;
    test('noise: same seed -> identical map', () => {
      assert(sameArray(noiseMap(W, H, 7), noiseMap(W, H, 7)), 'maps differ');
    });
    test('noise: different seed -> different map', () => {
      assert(!sameArray(noiseMap(W, H, 7), noiseMap(W, H, 8)), 'maps identical');
    });
    test('noise: values stay in [0, 1)', () => {
      const m = noiseMap(W, H, 99);
      assert(m.every(v => v >= 0 && v < 1), 'out of range');
    });
    test('noise: smooth (neighbouring cells differ by < 0.1)', () => {
      const m = noiseMap(W, H, 99);
      for (let i = 1; i < m.length; i++) {
        if (i % W === 0) continue;              // skip jumps from end of one row to start of next
        assert(Math.abs(m[i] - m[i - 1]) < 0.1, 'jump at index ' + i);
      }
    });

    // ---------- sim.js ----------
    test('sim: same seed, 600 ticks (births included) -> identical agents', () => {
      const run = () => {
        const s = createSim(config, WORLD_WIDTH, WORLD_HEIGHT);
        for (let t = 0; t < 600; t++) step(s, config);
        return s.agents.map(a => `${a.id},${a.x},${a.y},${a.grain},${a.fruit},${Object.values(a.genes)}`).join('|');
      };
      assert(run() === run(), 'runs diverged');
    });

    // ---------- reproduction ----------
    test('births: children appear, know their parent, and never break the pop cap', () => {
      const c = structuredClone(config);
      c.reproduction.maxPopulation = 1100;
      const s = createSim(c, WORLD_WIDTH, WORLD_HEIGHT);
      for (let t = 0; t < 800; t++) {
        step(s, c);
        assert(s.agents.length <= c.reproduction.maxPopulation, `pop ${s.agents.length} over cap at tick ${t}`);
      }
      assert(s.births > 0, 'no births in 800 ticks');
      assert(s.agents.some(a => a.parentId > 0), 'no living agent has a parent');
    });
    test('births: flag off -> nobody is ever born', () => {
      const c = structuredClone(config);
      c.features.reproduction = false;
      const s = createSim(c, WORLD_WIDTH, WORLD_HEIGHT);
      for (let t = 0; t < 400; t++) step(s, c);
      assert(s.births === 0 && s.agents.every(a => a.parentId === 0), 'someone was born');
    });

    // ---------- genes ----------
    test('genes: children stay within mutationRate of the parent, inside 0..1', () => {
      const rng = createRng(7);
      const parent = { greed: 0.5, trust: 0.99, aggression: 0.01, memory: 0.5 };
      for (let n = 0; n < 1000; n++) {
        const child = inheritGenes(parent, rng, config);
        for (const g of GENE_NAMES) {
          assert(child[g] >= 0 && child[g] <= 1, `${g} out of 0..1: ${child[g]}`);
          assert(Math.abs(child[g] - parent[g]) <= config.mutationRate, `${g} jumped too far`);
        }
      }
    });
    test('genes: mutation flag off -> exact clone', () => {
      const c = structuredClone(config);
      c.features.mutation = false;
      const parent = { greed: 0.3, trust: 0.6, aggression: 0.9, memory: 0.1 };
      const child = inheritGenes(parent, createRng(1), c);
      for (const g of GENE_NAMES) assert(child[g] === parent[g], `${g} changed`);
    });
    test('culture: child gets a COPY (changing it leaves the parent alone)', () => {
      const parent = neutralCulture();
      const child = copyCulture(parent);
      child.trust = 0.5;
      assert(parent.trust === 0 && child !== parent, 'parent and child share one culture object');
    });

    // ---------- aging ----------
    test('aging: nobody alive is past their maxAge, and some die of old age (3000 ticks)', () => {
      const s = createSim(config, WORLD_WIDTH, WORLD_HEIGHT);
      for (let t = 0; t < 3000; t++) step(s, config);
      assert(s.agents.every(a => a.age < a.maxAge), 'someone outlived maxAge');
      assert(s.deaths.oldAge > 0, 'no old-age deaths');
    });
    test('aging: flag off -> zero old-age deaths', () => {
      const c = structuredClone(config);
      c.features.aging = false;
      const s = createSim(c, WORLD_WIDTH, WORLD_HEIGHT);
      for (let t = 0; t < 3000; t++) step(s, c);
      assert(s.deaths.oldAge === 0, `${s.deaths.oldAge} old-age deaths`);
    });
    test('aging: an old agent burns more food than a young one', () => {
      const young = { age: 0, maxAge: 1000, grain: 10, fruit: 10 };
      const old = { age: 900, maxAge: 1000, grain: 10, fruit: 10 };
      metabolize(young, config);
      metabolize(old, config);
      assert(old.grain < young.grain, `old ${old.grain} vs young ${young.grain}`);
    });

    // ---------- events + tribes ----------
    test('bus: listeners hear emits; unsubscribe stops them', () => {
      const bus = createBus();
      let heard = 0;
      const off = bus.on('ping', d => { heard += d; });
      bus.emit('ping', 2);
      off();
      bus.emit('ping', 5);
      assert(heard === 2, `heard ${heard}`);
    });
    test('tribes: populations add up, each extinction announced once, only at 0', () => {
      const bus = createBus();
      const founded = [], extinct = [];
      bus.on('tribe:founded', e => founded.push(e.tribeId));
      bus.on('tribe:extinct', e => extinct.push(e.tribeId));
      const s = createSim(config, WORLD_WIDTH, WORLD_HEIGHT, bus);
      assert(founded.length === config.tribes.startCount, `founded ${founded.length}`);
      for (let t = 0; t < 3000; t++) {
        step(s, config);
        let sum = 0;
        for (const tr of s.tribes.byId.values()) sum += tr.population;
        assert(sum === s.agents.length, `tribe pops ${sum} != agents ${s.agents.length} at tick ${t}`);
      }
      assert(new Set(extinct).size === extinct.length, 'a tribe died out twice');
      for (const id of extinct) assert(s.tribes.byId.get(id).population === 0, `tribe ${id} "extinct" but alive`);
    });
    test('tribes: starve every member of tribe 1 -> exactly one "extinct" event, for tribe 1', () => {
      const bus = createBus();
      const extinct = [];
      bus.on('tribe:extinct', e => extinct.push(e.tribeId));
      const s = createSim(config, WORLD_WIDTH, WORLD_HEIGHT, bus);
      for (const a of s.agents) if (a.tribeId === 1) { a.grain = -100; a.fruit = -100; }  // a bite can't save them
      step(s, config);
      step(s, config);
      assert(extinct.length === 1 && extinct[0] === 1, `extinct events: [${extinct}]`);
    });
    test('splits: new tribes appear, and nobody is ever too far from their own founder (6000 ticks)', () => {
      const s = createSim(config, WORLD_WIDTH, WORLD_HEIGHT);
      for (let t = 0; t < 6000; t++) step(s, config);
      const splits = [...s.tribes.byId.values()].filter(t => t.parentTribeId > 0);
      assert(splits.length > 0, 'no splits in 10 years');
      for (const a of s.agents) {
        const d = geneDistance(a.genes, s.tribes.byId.get(a.tribeId).founderGenes);
        assert(d <= config.tribes.splitThreshold, `agent ${a.id} is ${d.toFixed(3)} from its founder`);
      }
    });
    test('splits: flag off -> only the starting tribes ever exist', () => {
      const c = structuredClone(config);
      c.features.tribeSplits = false;
      const s = createSim(c, WORLD_WIDTH, WORLD_HEIGHT);
      for (let t = 0; t < 6000; t++) step(s, c);
      assert(s.tribes.byId.size === c.tribes.startCount, `${s.tribes.byId.size} tribes`);
    });
    test('tribes: same seed -> same names', () => {
      const names = () => [...createSim(config, WORLD_WIDTH, WORLD_HEIGHT).tribes.byId.values()].map(t => t.name).join(',');
      assert(names() === names(), 'names differ');
    });

    // ---------- world.js terrain ----------
    test('terrain: same seed -> identical terrain', () => {
      const t1 = createSim(config, WORLD_WIDTH, WORLD_HEIGHT).world.terrain;
      const t2 = createSim(config, WORLD_WIDTH, WORLD_HEIGHT).world.terrain;
      assert(sameArray(t1, t2), 'terrain differs');
    });
    test('terrain: no agent ever stands on water or mountain (500 ticks)', () => {
      const s = createSim(config, WORLD_WIDTH, WORLD_HEIGHT);
      for (let t = 0; t < 500; t++) {
        step(s, config);
        for (const a of s.agents) {
          assert(PASSABLE[s.world.terrain[a.y * WORLD_WIDTH + a.x]], `agent ${a.id} on impassable cell at tick ${t}`);
        }
      }
    });

    // ---------- visual check: draw a noise map in grayscale ----------
    const ctx = document.getElementById('preview').getContext('2d');
    const img = ctx.createImageData(W, H);
    const map = noiseMap(W, H, 12345);
    for (let i = 0; i < map.length; i++) {
      const v = map[i] * 255;
      img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
      img.data[i * 4 + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  </script>
</body>
</html>
